spring.application.name=RoomHubB2B
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roomhub_b2b}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

springdoc.api-docs.path=/api/openapi
springdoc.paths-to-match=/api/**
springdoc.writer-with-default-pretty-printer=true
spring.jackson.default-property-inclusion=always

roomhub.auth.token.issuer=${ROOMHUB_AUTH_TOKEN_ISSUER:roomhub-b2b}
roomhub.auth.token.ttl=${ROOMHUB_AUTH_TOKEN_TTL:PT15M}
roomhub.auth.token.secret=${ROOMHUB_AUTH_TOKEN_SECRET}

roomhub.booking.confirmation-hold=${ROOMHUB_BOOKING_CONFIRMATION_HOLD:PT30M}
roomhub.booking.batch-size=${ROOMHUB_BOOKING_BATCH_SIZE:100}
roomhub.booking.scheduler-delay=${ROOMHUB_BOOKING_SCHEDULER_DELAY:PT30S}

roomhub.geocoding.yandex.api-key=${ROOMHUB_GEOCODING_YANDEX_API_KEY}
roomhub.geocoding.yandex.base-url=${YANDEX_GEOCODER_BASE_URL:https://geocode-maps.yandex.ru/v1}
roomhub.geocoding.yandex.lang=${YANDEX_GEOCODER_LANG:ru_RU}
roomhub.geocoding.yandex.results=${YANDEX_GEOCODER_RESULTS:1}
roomhub.geocoding.yandex.timeout=${YANDEX_GEOCODER_TIMEOUT:PT3S}

roomhub.ai.gigachat.authorization-key=${ROOMHUB_AI_GIGACHAT_AUTHORIZATION_KEY}
roomhub.ai.gigachat.oauth-url=${GIGACHAT_OAUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
roomhub.ai.gigachat.chat-url=${GIGACHAT_CHAT_URL:https://gigachat.devices.sberbank.ru/api/v1/chat/completions}
roomhub.ai.gigachat.model=${GIGACHAT_MODEL:GigaChat}
roomhub.ai.gigachat.scope=${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
roomhub.ai.gigachat.timeout=${GIGACHAT_TIMEOUT:PT5S}
roomhub.ai.gigachat.token-safety-skew=${GIGACHAT_TOKEN_SAFETY_SKEW:PT30S}
roomhub.ai.gigachat.insecure-skip-tls-verification=${GIGACHAT_INSECURE_SKIP_TLS_VERIFICATION:false}
roomhub.ai.gigachat.max-prompt-length=${GIGACHAT_MAX_PROMPT_LENGTH:1000}
roomhub.ai.gigachat.default-limit=${GIGACHAT_DEFAULT_LISTING_LIMIT:10}
roomhub.ai.gigachat.max-limit=${GIGACHAT_MAX_LISTING_LIMIT:20}
