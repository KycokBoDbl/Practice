spring.application.name=RoomHubB2B
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roomhub_b2b}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

springdoc.api-docs.path=/api/openapi
springdoc.paths-to-match=/api/**

roomhub.auth.token.issuer=${ROOMHUB_AUTH_TOKEN_ISSUER:roomhub-b2b}
roomhub.auth.token.ttl=${ROOMHUB_AUTH_TOKEN_TTL:PT15M}
roomhub.auth.token.secret=${ROOMHUB_AUTH_TOKEN_SECRET}
